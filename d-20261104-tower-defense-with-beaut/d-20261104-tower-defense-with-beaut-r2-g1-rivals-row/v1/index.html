<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rivals' Row</title>
<style>
html,body{margin:0;height:100%;background:#120914;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;background:#1b0f1f}
</style></head><body>
<canvas id="c" width="390" height="844"></canvas>
<script>
(function(){
"use strict";
var W=390,H=844,STEP=1/120;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var cssScale=1;
function resize(){
  var iw=window.innerWidth||390,ih=window.innerHeight||844,dpr=window.devicePixelRatio||1;
  cssScale=Math.min(iw/W,ih/H);
  cv.style.width=(W*cssScale)+'px';cv.style.height=(H*cssScale)+'px';
  cv.width=Math.round(W*cssScale*dpr);cv.height=Math.round(H*cssScale*dpr);
}
window.addEventListener('resize',resize);resize();

/* ---------- art ---------- */
function ld(p){var i=new Image();i.src=p;return i;}
var imgH=ld('assets/sprites/heroes.png'),imgE=ld('assets/sprites/enemies.png'),imgI=ld('assets/sprites/icons.png');
function ok(i){return i.complete&&i.naturalWidth>0;}

/* ---------- heroes / rivalry graph ---------- */
var NAMES=['CASSIAN','MIRELLE','AUREN','VIOLET','ROWAN'];
var COLS=['#e0405a','#2fb5a5','#f0c050','#b07ad8','#6ab04c'];
// REL: 0 neutral, 1 rival, 2 unfriendly
var REL=new Uint8Array(25);
function setRel(a,b,v){REL[a*5+b]=v;REL[b*5+a]=v;}
setRel(0,2,1);setRel(0,4,1);setRel(1,3,1);setRel(2,3,1); // rivals
setRel(0,1,2);setRel(2,4,2);                              // unfriendly
var LANE_OF=[0,0,1,2,2],LX=[65,195,325];
var SLOT_W=78,DEF_Y=632,SPAWN_Y=150;

/* ---------- state ---------- */
var order=[0,1,2,3,4];
var hx=new Float32Array(5),cd=new Float32Array(5),stun=new Float32Array(5),recoil=new Float32Array(5);
var bick=new Uint8Array(5);
var pairFlash=new Float32Array(4);
var state='play',T=0,score=0,best=0,hearts=3,chain=1,chainMax=1,lastCreate=-99,win=false;
var firstSwap=false,lastSwapT=0,hintSlot=-1,spawnT=1,wave=0,overT=0,nextId=1;
var bannerT=0,bannerText='',bannerCol='#ffd98a';
var shake=0,chainPulse=0,chainBad=0,heartHit=0,deadFlash=0;
var scoreStr='0',kills=0;
var CH=['x1','x2','x3','x4','x5','x6','x7','x8','x9'];

var enemies=[],bullets=[],parts=[],floats=[];
var i;
for(i=0;i<28;i++)enemies.push({a:false,id:0,type:0,lane:0,x:0,y:0,hp:0,mhp:1,sp:0,flash:0,pend:0,ph:0});
for(i=0;i<110;i++)bullets.push({a:false,x:0,y:0,tgt:null,tid:0,dmg:1,col:'#fff'});
for(i=0;i<160;i++)parts.push({a:false,x:0,y:0,vx:0,vy:0,l:0,ml:1,col:'#fff',s:3});
for(i=0;i<24;i++)floats.push({a:false,x:0,y:0,l:0,t:'',col:'#fff',s:16});
var ETYPE=[{hp:3,sp:38,val:10,sz:74},{hp:2,sp:82,val:15,sz:76},{hp:10,sp:23,val:40,sz:96}];

/* ---------- audio ---------- */
var AC=null,master=null,lastShot=0,lastKill=0;
function audioInit(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=0.3;master.connect(AC.destination);}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
}
function tone(f,d,type,v,f2,delay){
  if(!AC)return;
  try{
    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
function sfxShot(dbl){var n=performance.now();if(n-lastShot<70)return;lastShot=n;tone(dbl?700:520,0.05,'square',0.05,dbl?420:300);}
function sfxKill(){var n=performance.now();if(n-lastKill<50)return;lastKill=n;tone(300,0.12,'triangle',0.25,90);}
function sfxPair(c){var b=440+c*45;tone(b,0.14,'sine',0.3);tone(b*1.5,0.2,'sine',0.25,null,0.08);tone(b*2,0.25,'triangle',0.2,null,0.16);}
function sfxStun(){tone(180,0.35,'sawtooth',0.25,70);tone(120,0.35,'square',0.15,60,0.05);}
function sfxBreach(){tone(110,0.4,'sawtooth',0.4,40);}
function sfxOver(w){if(w){tone(523,0.2,'triangle',0.3);tone(659,0.2,'triangle',0.3,null,0.15);tone(784,0.4,'triangle',0.3,null,0.3);}else{tone(300,0.5,'sawtooth',0.3,80);}}
function sfxTap(){tone(800,0.04,'sine',0.12);}

/* ---------- helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function slotX(s){return SLOT_W*s+SLOT_W/2;}
var bannerW=0;
function banner(t,c,d){bannerText=t;bannerW=-1;bannerCol=c||'#ffd98a';bannerT=d||1.6;}
function burst(x,y,col,n,sp){
  for(var k=0;k<parts.length&&n>0;k++){var p=parts[k];if(p.a)continue;
    p.a=true;p.x=x;p.y=y;var an=Math.random()*6.283,v=(0.3+Math.random()*0.7)*sp;
    p.vx=Math.cos(an)*v;p.vy=Math.sin(an)*v;p.l=p.ml=0.35+Math.random()*0.35;p.col=col;p.s=2+Math.random()*3;n--;}
}
function floatText(x,y,t,col,s){
  for(var k=0;k<floats.length;k++){var f=floats[k];if(f.a)continue;f.a=true;f.x=x;f.y=y;f.l=0.9;f.t=t;f.col=col;f.s=s||16;return;}
}
function relAt(a,b){return REL[order[a]*5+order[b]];}
// flags: 1 create rival, 2 break rival, 4 unfriendly, for swapping slots i,i+1
function evalSwap(s){
  var f=0,h0=order[s],h1=order[s+1];
  if(s>0){var l=order[s-1];if(REL[l*5+h1]===1)f|=1;if(REL[l*5+h0]===1)f|=2;if(REL[l*5+h1]===2)f|=4;}
  if(s<3){var r=order[s+2];if(REL[h0*5+r]===1)f|=1;if(REL[h1*5+r]===1)f|=2;if(REL[h0*5+r]===2)f|=4;}
  return f;
}
function findHint(){
  var st=(Math.random()*4)|0;
  for(var k=0;k<4;k++){var s=(st+k)%4;if(evalSwap(s)===1)return s;}
  return -1;
}
function recomputeBick(){
  for(var s=0;s<5;s++)bick[s]=((s>0&&relAt(s-1,s)===1)||(s<4&&relAt(s,s+1)===1))?1:0;
}

/* ---------- game flow ---------- */
function startGame(){
  var tries=0,ok2=false,tmp=[0,1,2,3,4];
  while(tries++<300&&!ok2){
    for(var a=4;a>0;a--){var b=(Math.random()*(a+1))|0,t=tmp[a];tmp[a]=tmp[b];tmp[b]=t;}
    for(var s=0;s<5;s++)order[s]=tmp[s];
    var bad=false;for(s=0;s<4;s++)if(relAt(s,s+1)!==0)bad=true;
    if(!bad&&findHint()>=0)ok2=true;
  }
  if(!ok2){order[0]=0;order[1]=3;order[2]=4;order[3]=1;order[4]=2;}
  for(var s2=0;s2<5;s2++){hx[order[s2]]=slotX(s2);cd[s2]=0.3+s2*0.1;stun[s2]=0;recoil[s2]=0;pairFlash[s2%4]=0;}
  for(i=0;i<enemies.length;i++)enemies[i].a=false;
  for(i=0;i<bullets.length;i++)bullets[i].a=false;
  for(i=0;i<parts.length;i++)parts[i].a=false;
  for(i=0;i<floats.length;i++)floats[i].a=false;
  state='play';T=0;score=0;scoreStr='0';hearts=3;chain=1;chainMax=1;lastCreate=-99;win=false;kills=0;
  firstSwap=false;lastSwapT=0;spawnT=1.2;wave=0;shake=0;heartHit=0;deadFlash=0;sel=-1;drag=null;
  recomputeBick();hintSlot=findHint();
  banner('Swap heroes so rivals stand together','#ffd98a',9999);
}
var sel=-1,drag=null;

function doSwap(s){
  var f=evalSwap(s),h0=order[s],h1=order[s+1];
  order[s]=h1;order[s+1]=h0;
  firstSwap=true;lastSwapT=T;
  recomputeBick();
  var cx=(slotX(s)+slotX(s+1))/2;
  if(f&(2|4)){
    stun[h0]=stun[h1]=1.5;
    var had=chain>1;chain=1;chainBad=0.6;shake=Math.max(shake,8);
    banner((f&4)?'SQUABBLE! Unfriendly pair':'SQUABBLE! Rivalry broken','#ff7a8a',1.8);
    floatText(cx,690,'STUNNED','#ff9aa8',20);
    if(had)floatText(195,95,'chain lost','#ff9aa8',14);
    sfxStun();burst(cx,720,'#ff6b7f',16,160);
  }else if(f&1){
    if(chain<2||T-lastCreate<=3)chain=Math.min(9,chain+1);
    lastCreate=T;if(chain>chainMax)chainMax=chain;chainPulse=0.5;
    pairFlash[s]=0.9;pairFlash[s>0?s-1:s]=Math.max(pairFlash[s>0?s-1:s],0);
    // flash on any boundary that is now a rival pair
    for(var b=0;b<4;b++)if(relAt(b,b+1)===1&&(b===s-1||b===s||b===s+1))pairFlash[b]=0.9;
    var bonus=25*chain;score+=bonus;scoreStr=''+score;
    banner('RIVALRY! DOUBLE FIRE','#ffd98a',1.6);
    floatText(cx,690,'+'+bonus,'#ffe08a',20);
    sfxPair(chain);burst(cx,700,'#ffd070',22,200);
  }else{
    sfxTap();
  }
  hintSlot=findHint();
  sel=-1;
}

function spawnEnemy(){
  for(var k=0;k<enemies.length;k++){var e=enemies[k];if(e.a)continue;
    var r=Math.random(),ty=0;
    if(T>35&&r<0.22+Math.min(0.2,(T-35)/200))ty=2;else if(T>14&&r<0.5)ty=1;
    e.a=true;e.id=nextId++;e.type=ty;e.lane=(Math.random()*3)|0;
    e.x=LX[e.lane];e.y=SPAWN_Y-30;e.hp=e.mhp=ETYPE[ty].hp+(T>80&&ty===2?2:0);
    e.sp=ETYPE[ty].sp*(1+T/400);e.flash=0;e.pend=0;e.ph=Math.random()*6;return;}
}
function pickTarget(lane){
  var best=null;
  for(var k=0;k<enemies.length;k++){var e=enemies[k];
    if(!e.a||e.lane!==lane||e.y<SPAWN_Y||e.hp-e.pend<=0)continue;
    if(!best||e.y>best.y)best=e;}
  return best;
}
function fire(slot,h){
  var e=pickTarget(LANE_OF[slot]);if(!e)return false;
  for(var k=0;k<bullets.length;k++){var b=bullets[k];if(b.a)continue;
    b.a=true;b.x=slotX(slot);b.y=700;b.tgt=e;b.tid=e.id;b.dmg=bick[slot]?2:1;b.col=bick[slot]?'#ffe08a':COLS[h];
    e.pend+=b.dmg;recoil[h]=1;sfxShot(bick[slot]);return true;}
  return false;
}
function addScore(v){score+=v*chain;scoreStr=''+score;}

function updateFx(dt){
  var k;
  for(k=0;k<parts.length;k++){var p=parts[k];if(!p.a)continue;p.l-=dt;if(p.l<=0){p.a=false;continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.985;p.vy*=0.985;}
  for(k=0;k<floats.length;k++){var f=floats[k];if(!f.a)continue;f.l-=dt;f.y-=36*dt;if(f.l<=0)f.a=false;}
  if(shake>0)shake=Math.max(0,shake-30*dt);
  if(deadFlash>0)deadFlash-=dt;if(chain>1&&T-lastCreate>3){chain=1;chainBad=0.4;}if(chainPulse>0)chainPulse-=dt;if(chainBad>0)chainBad-=dt;if(heartHit>0)heartHit-=dt;
  for(k=0;k<4;k++)if(pairFlash[k]>0)pairFlash[k]-=dt;
  for(k=0;k<5;k++)if(recoil[k]>0)recoil[k]=Math.max(0,recoil[k]-dt*8);
  var kk=1-Math.exp(-18*dt);
  for(k=0;k<5;k++){var h=order[k];if(drag&&drag.moved&&drag.slot===k)hx[h]=Math.max(20,Math.min(W-20,drag.x));else hx[h]+=(slotX(k)-hx[h])*kk;}
}
function update(dt){
  updateFx(dt);
  if(state==='over'){overT+=dt;return;}
  T+=dt;if(bannerT<9000&&bannerT>0)bannerT-=dt;
  var k;
  var w=(T/20)|0;if(w!==wave){wave=w;if(w>0)banner('WAVE '+(w+1)+(w===2?' - tanks!':''),'#ffd98a',1.6);}
  // spawn
  spawnT-=dt;
  if(spawnT<=0){
    var p=Math.min(1,T/120);spawnT=1.9-1.15*p+Math.random()*0.3;
    spawnEnemy();if(T>60&&Math.random()<0.3)spawnEnemy();
  }
  // heroes
  for(k=0;k<5;k++){var h=order[k];
    if(stun[h]>0){stun[h]-=dt;continue;}
    cd[h]-=dt;if(cd[h]<=0){if(fire(k,h))cd[h]=0.6;else cd[h]=0;}
  }
  // enemies
  for(k=0;k<enemies.length;k++){var e=enemies[k];if(!e.a)continue;
    e.y+=e.sp*dt;if(e.flash>0)e.flash-=dt;
    if(e.y>=DEF_Y){
      e.a=false;hearts--;shake=14;heartHit=0.6;sfxBreach();banner('BREACH!','#ff7a8a',1.2);
      burst(e.x,DEF_Y,'#ff5060',18,200);
      if(hearts<=0){endGame(false);return;}
    }
  }
  // bullets
  for(k=0;k<bullets.length;k++){var b=bullets[k];if(!b.a)continue;
    var t=b.tgt;if(!t||!t.a||t.id!==b.tid){b.a=false;continue;}
    var dx=t.x-b.x,dy=t.y-b.y,d=Math.sqrt(dx*dx+dy*dy),st=560*dt;
    if(d<=st+16){
      b.a=false;t.pend-=b.dmg;if(t.pend<0)t.pend=0;t.hp-=b.dmg;t.flash=0.1;
      burst(t.x,t.y,b.col,b.dmg>1?7:4,140);
      if(t.hp<=0){
        t.a=false;kills++;var v=ETYPE[t.type].val;addScore(v);
        floatText(t.x,t.y-20,'+'+(v*chain),chain>1?'#ffe08a':'#ffffff',16+Math.min(chain,6));
        burst(t.x,t.y,'#ffd9a0',14,210);sfxKill();if(t.type===2)shake=Math.max(shake,6);
      }
    }else{b.x+=dx/d*st;b.y+=dy/d*st;}
  }
  if(T>=120)endGame(true);
}
var overScore='',overBest='',overKills='';
function endGame(w){
  state='over';win=w;overT=0;if(score>best)best=score;overScore=''+score;overBest='BEST '+best+'   MAX CHAIN '+CH[chainMax-1];overKills='KILLS '+kills;sfxOver(w);if(!w)deadFlash=0.5;
}

/* ---------- drawing ---------- */
var gBg=ctx.createLinearGradient(0,0,0,H);
gBg.addColorStop(0,'#2a1530');gBg.addColorStop(0.55,'#3a1a38');gBg.addColorStop(1,'#150a18');
function icon(k,x,y,s){if(ok(imgI))ctx.drawImage(imgI,k*64,0,64,64,x-s/2,y-s/2,s,s);}
var FONTS={};
function txt(t,x,y,size,col,al){ctx.font=FONTS[size]||(FONTS[size]='bold '+size+'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif');ctx.fillStyle=col;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(t,x,y);}

function drawHero(slot,lift){
  var h=order[slot],x=hx[h],st=stun[h]>0,sc=1+recoil[h]*0.06;
  var y=690-lift;
  ctx.save();
  if(st)ctx.globalAlpha=0.55;
  if(ok(imgH)){ctx.translate(x,y+51);ctx.scale(sc,sc);ctx.drawImage(imgH,h*128,0,128,192,-34,-51,68,102);}
  ctx.restore();
  if(st){
    var a=T*8;ctx.save();ctx.translate(x,y-4);ctx.rotate(Math.sin(a)*0.25);icon(1,0,0,34);ctx.restore();
  }
}
function draw(){
  var sx=0,sy=0;if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake;}
  var k=cv.width/W;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#120914';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(k,0,0,k,sx*k,sy*k);
  ctx.fillStyle=gBg;ctx.fillRect(-10,-10,W+20,H+20);
  // lanes
  var l;
  for(l=0;l<3;l++){ctx.fillStyle='rgba(255,170,190,0.10)';rr(LX[l]-59,100,118,DEF_Y-100+8,10);ctx.fill();}
  ctx.font='bold 9px system-ui,sans-serif';
  txt('LEFT',LX[0],140,9,'rgba(255,225,200,0.4)');txt('CENTRE',LX[1],140,9,'rgba(255,225,200,0.4)');txt('RIGHT',LX[2],140,9,'rgba(255,225,200,0.4)');
  // defence line
  ctx.fillStyle='rgba(255,215,140,0.55)';ctx.fillRect(0,DEF_Y,W,2);
  ctx.fillStyle='rgba(20,8,24,0.9)';rr(145,DEF_Y+6,100,16,8);ctx.fill();txt('DEFENCE LINE',195,DEF_Y+14,10,'#ffd98a');
  // enemies (back to front by y: simple pass)
  var e,k2;
  for(k2=0;k2<enemies.length;k2++){e=enemies[k2];if(!e.a)continue;
    var tp=ETYPE[e.type],sz=tp.sz,bob=Math.sin(T*6+e.ph)*2;
    if(ok(imgE))ctx.drawImage(imgE,e.type*128,0,128,128,e.x-sz/2,e.y-sz/2+bob,sz,sz);
    if(e.flash>0){ctx.globalAlpha=0.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x,e.y+bob,sz*0.28,0,6.283);ctx.fill();ctx.globalAlpha=1;}
    if(e.hp<e.mhp){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(e.x-18,e.y-sz/2-2,36,4);ctx.fillStyle='#ff6b7f';ctx.fillRect(e.x-18,e.y-sz/2-2,36*e.hp/e.mhp,4);}
  }
  // bullets
  for(k2=0;k2<bullets.length;k2++){var b=bullets[k2];if(!b.a)continue;
    ctx.fillStyle=b.col;ctx.globalAlpha=0.35;ctx.beginPath();ctx.arc(b.x,b.y,b.dmg>1?9:6,0,6.283);ctx.fill();
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(b.x,b.y,b.dmg>1?5:3.5,0,6.283);ctx.fill();}
  // hero pills
  var focus=drag?drag.slot:sel;
  var s;
  for(s=0;s<5;s++){
    var cx=slotX(s),h=order[s];
    ctx.fillStyle=bick[s]?'rgba(120,50,70,0.95)':'rgba(40,18,44,0.95)';rr(cx-35,668,70,148,26);ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle=bick[s]?'#ffd070':'rgba(255,215,140,0.35)';ctx.stroke();
    if(bick[s]){ctx.globalAlpha=0.35+0.2*Math.sin(T*8);ctx.fillStyle='#ffd070';rr(cx-35,668,70,148,26);ctx.fill();ctx.globalAlpha=1;
      txt('x2',cx+22,676,10,'#ffe08a');}
    if(focus>=0&&s!==focus){
      var rl=REL[order[focus]*5+h];
      if(rl){ctx.lineWidth=3;ctx.strokeStyle=rl===1?'#7dffb0':'#ff4d63';rr(cx-37,666,74,152,27);ctx.stroke();
        txt(rl===1?'RIVAL':'UNFRIENDLY',cx,656,10,rl===1?'#7dffb0':'#ff7a8a');}
    }
    if(focus===s){ctx.lineWidth=3;ctx.strokeStyle='#fff';rr(cx-37,666,74,152,27);ctx.stroke();}
  }
  // hint highlight
  if(hintSlot>=0&&state==='play'&&(!firstSwap||T-lastSwapT>7)&&!drag){
    var pu=0.5+0.5*Math.sin(T*6),x0=slotX(hintSlot)-37,w2=SLOT_W+74;
    ctx.lineWidth=4;ctx.globalAlpha=0.5+0.5*pu;ctx.strokeStyle='#ffe678';rr(x0,664,w2-SLOT_W+SLOT_W,156,28);ctx.stroke();ctx.globalAlpha=1;
    var mx=(slotX(hintSlot)+slotX(hintSlot+1))/2;
    txt('⇄',mx,640-4*pu,26,'#ffe08a');
  }
  // heroes (non-dragged first)
  var dh=-1;
  for(s=0;s<5;s++){if(drag&&drag.moved&&drag.slot===s){dh=s;continue;}drawHero(s,0);}
  for(s=0;s<5;s++){
    var hh=order[s],cx2=slotX(s);
    txt(NAMES[hh],cx2,800,10,'#ffe9cc');
    var n=0,dxs=cx2-10;
    // rival dots (filled) / unfriendly (hollow red)
    var o;for(o=0;o<5;o++){var rv=REL[hh*5+o];if(!rv)continue;
      ctx.beginPath();ctx.arc(dxs+n*13,809,4,0,6.283);
      if(rv===1){ctx.fillStyle=COLS[o];ctx.fill();}else{ctx.lineWidth=1.5;ctx.strokeStyle='#ff4d63';ctx.stroke();ctx.beginPath();ctx.moveTo(dxs+n*13-3,806);ctx.lineTo(dxs+n*13+3,812);ctx.stroke();}
      n++;}
  }
  if(dh>=0)drawHero(dh,14);
  // pair icons
  for(s=0;s<4;s++){
    if(relAt(s,s+1)===1){
      var mx2=(slotX(s)+slotX(s+1))/2,pf=pairFlash[s]>0?pairFlash[s]:0,sz2=26+pf*40;
      if(pf>0){ctx.globalAlpha=pf;ctx.fillStyle='#ffd070';ctx.beginPath();ctx.arc(mx2,700,30+(1-pf)*30,0,6.283);ctx.fill();ctx.globalAlpha=1;}
      icon(0,mx2,700,sz2);
    }
  }
  // legend
  txt('● rival colour   ✕ unfriendly',195,833,10,'rgba(255,225,200,0.5)');
  // particles
  for(k2=0;k2<parts.length;k2++){var p=parts[k2];if(!p.a)continue;ctx.globalAlpha=Math.max(0,p.l/p.ml);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  ctx.globalAlpha=1;
  for(k2=0;k2<floats.length;k2++){var f=floats[k2];if(!f.a)continue;ctx.globalAlpha=Math.min(1,f.l*2);txt(f.t,f.x,f.y,f.s,f.col);}
  ctx.globalAlpha=1;
  // HUD
  ctx.fillStyle='rgba(30,12,34,0.85)';rr(10,8,108,66,14);ctx.fill();
  txt('SCORE',22,24,9,'#e8c48a','left');txt(scoreStr,22,50,26,'#fff','left');
  var bs=1+(chainPulse>0?chainPulse*0.5:0),bx=195+(chainBad>0?Math.sin(T*60)*4:0);
  ctx.save();ctx.translate(bx,41);ctx.scale(bs,bs);
  ctx.fillStyle=chainBad>0?'rgba(120,20,40,0.9)':'rgba(30,12,34,0.88)';rr(-52,-33,104,68,14);ctx.fill();
  txt('RIVAL CHAIN',0,-20,10,'#e8c48a');txt(CH[chain-1],0,2,32,chain>1?'#ffd070':'#ffffff');
  var fr=chain>1||lastCreate>-90?Math.max(0,1-(T-lastCreate)/3):0;
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(-36,24,72,5);ctx.fillStyle='#ffd070';ctx.fillRect(-36,24,72*fr,5);
  ctx.restore();
  ctx.fillStyle='rgba(30,12,34,0.85)';rr(272,8,108,66,14);ctx.fill();
  for(k2=0;k2<3;k2++){ctx.globalAlpha=k2<hearts?1:0.22;var hs=34+(heartHit>0&&k2===hearts?10:0);icon(2,298+k2*36,41,hs);}
  ctx.globalAlpha=1;
  // time bar
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(14,84,362,4);ctx.fillStyle='#ffb0c0';ctx.fillRect(14,84,362*Math.min(1,T/120),4);
  // banner
  if(bannerT>0&&state==='play'){
    var al=bannerT>9000?1:Math.min(1,bannerT*2);
    ctx.globalAlpha=al;ctx.font='bold 13px system-ui,sans-serif';
    if(bannerW<0)bannerW=ctx.measureText(bannerText).width;var bw=Math.min(370,bannerW+44);
    ctx.fillStyle='rgba(30,12,34,0.92)';rr(195-bw/2,96,bw,32,16);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=bannerCol;ctx.stroke();
    txt(bannerText,195,112,13,bannerCol);ctx.globalAlpha=1;
  }
  if(deadFlash>0){ctx.globalAlpha=Math.min(1,deadFlash);ctx.fillStyle='#ff3c50';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(state==='over')drawOver();
}
function drawOver(){
  ctx.fillStyle='rgba(10,4,14,0.72)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f6e7d0';rr(40,200,310,360,26);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#7a2a4a';ctx.stroke();
  txt(win?"ROW HELD!":'BREACHED!',195,246,28,'#5a1f3d');
  txt(win?'You survived the full 2 minutes':'3 invaders slipped past',195,276,13,'#7a4a5e');
  txt('SCORE',195,318,11,'#8a5a6e');txt(overScore,195,350,38,'#3a1230');
  txt(overBest,195,392,13,'#7a2a4a');
  txt(overKills,195,416,12,'#7a4a5e');
  var pu=1+0.04*Math.sin(overT*6);
  ctx.save();ctx.translate(195,488);ctx.scale(pu,pu);
  ctx.fillStyle='#7a2a4a';rr(-110,-30,220,60,30);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#ffd070';ctx.stroke();
  txt('TAP TO RESTART',0,0,18,'#fff4dc');ctx.restore();
}

/* ---------- input ---------- */
function pt(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
var P={x:0,y:0};
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();audioInit();
  var q=pt(e);P.x=q.x;P.y=q.y;
  if(state==='over'){if(overT>0.6){sfxTap();startGame();}return;}
  if(q.y>=650&&q.y<=830){
    var s=Math.max(0,Math.min(4,(q.x/SLOT_W)|0));
    drag={id:e.pointerId,slot:s,sx:q.x,x:q.x,moved:false};
    try{cv.setPointerCapture(e.pointerId);}catch(er){}
  }
},{passive:false});
cv.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;e.preventDefault();
  var q=pt(e);drag.x=q.x;if(Math.abs(q.x-drag.sx)>8)drag.moved=true;
},{passive:false});
function release(e){
  if(!drag||e.pointerId!==drag.id)return;
  var d=drag,q=pt(e);drag=null;
  if(state!=='play')return;
  if(d.moved){
    var from=d.slot,tgt=Math.max(0,Math.min(4,(q.x/SLOT_W)|0));
    if(tgt===from&&Math.abs(q.x-d.sx)>SLOT_W*0.35)tgt=from+(q.x>d.sx?1:-1);
    if(tgt>from)tgt=from+1;else if(tgt<from)tgt=from-1;
    if(tgt>=0&&tgt<=4&&tgt!==from){doSwap(Math.min(from,tgt));}
  }else{
    if(sel>=0&&Math.abs(sel-d.slot)===1){doSwap(Math.min(sel,d.slot));}
    else{sel=(sel===d.slot)?-1:d.slot;sfxTap();}
  }
}
cv.addEventListener('pointerup',function(e){e.preventDefault();release(e);},{passive:false});
cv.addEventListener('pointercancel',function(e){if(drag&&e.pointerId===drag.id)drag=null;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---------- main loop (fixed step 1/120) ---------- */
var last=0,acc=0;
function frame(ts){
  var dt=(ts-last)/1000;last=ts;if(!(dt>0)||dt>0.1)dt=Math.min(0.1,Math.max(0,dt||0));
  acc+=dt;var n=0;
  while(acc>=STEP&&n<30){update(STEP);acc-=STEP;n++;}
  if(n>=30)acc=0;
  draw();
  requestAnimationFrame(frame);
}
startGame();
requestAnimationFrame(function(ts){last=ts;requestAnimationFrame(frame);});
})();
</script></body></html>

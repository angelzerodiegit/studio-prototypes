<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Conveyor Sushi Memory</title>
<style>
html,body{margin:0;height:100%;background:#2a1b2e;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
#wrap{position:fixed;left:50%;top:50%;width:390px;height:844px;transform-origin:center;background:#3b2440}
canvas{display:block;width:390px;height:844px}
</style></head><body>
<div id="wrap"><canvas id="c" width="390" height="844"></canvas></div>
<script>
(function(){
var W=390,H=844,cv=document.getElementById('c'),g=cv.getContext('2d'),wrap=document.getElementById('wrap');
function fit(){var s=Math.min(innerWidth/W,innerHeight/H);wrap.style.transform='translate(-50%,-50%) scale('+s+')';}
fit();addEventListener('resize',fit);
var COLS=['#ff7a6b','#ffd166','#7bdc8f','#6bc5ff','#c58bff','#f4f4f4'],NAMES=6;
var DT=1/120,acc=0,last=0,t=0;
var state='title',hearts=3,mult=1,score=0,served=0,best=0;
var order=[],oi=0,showT=0,lastPick=-9,flash=0,msg='',msgT=0,shake=0;
var plates=[],MAXP=14,floats=[],FMAX=8;
for(var i=0;i<MAXP;i++)plates.push({on:false,x:0,y:0,k:0,vis:0});
for(i=0;i<FMAX;i++)floats.push({on:false,x:0,y:0,s:'',a:0});
var spawnT=0,beltOff=0,speed=110,orderLen=3,targetGap=0,audio=null,seq=0;
function ac(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)();}catch(e){audio=null}}
function beep(f,d){if(!audio)return;try{var o=audio.createOscillator(),v=audio.createGain();o.frequency.value=f;v.gain.value=.08;o.connect(v);v.connect(audio.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d);}catch(e){}}
function say(s,d){msg=s;msgT=d||1;}
function fl(x,y,s){for(var i=0;i<FMAX;i++)if(!floats[i].on){var f=floats[i];f.on=true;f.x=x;f.y=y;f.s=s;f.a=1;return}}
function newOrder(){order.length=0;for(var i=0;i<orderLen;i++)order.push((Math.random()*NAMES)|0);oi=0;showT=1.5;targetGap=0;}
function reset(){hearts=3;mult=1;score=0;served=0;speed=110;orderLen=3;spawnT=0;lastPick=-9;t=0;for(var i=0;i<MAXP;i++)plates[i].on=false;newOrder();state='play';}
// fixed schedule: the next needed icon is guaranteed within every 5 spawns
function spawn(){
  var p=null;for(var i=0;i<MAXP;i++)if(!plates[i].on){p=plates[i];break}
  if(!p)return;
  targetGap++;
  var k=(Math.random()*NAMES)|0;
  if(targetGap>=2){k=order[oi];targetGap=0;}
  p.on=true;p.k=k;p.x=-30;p.y=0;p.vis=1;
}
function pick(p){
  p.on=false;
  var gap=t-lastPick;
  if(p.k===order[oi]){
    var fast=gap<=0.5;
    if(gap<=1.0||lastPick<0)mult=Math.min(5,mult+(fast?2:1));else mult=Math.max(1,mult);
    if(lastPick<0)mult=Math.max(mult,1);
    lastPick=t;score+=10*mult;oi++;beep(520+oi*120,.12);fl(p.x,330,fast?'FAST +'+10*mult:'+'+10*mult);
    if(oi>=order.length){served++;score+=50;say('Served! +50',1);beep(880,.25);orderLen=Math.min(5,3+((served/3)|0));speed=Math.min(230,110+served*10);newOrder();lastPick=t;}
  }else{miss('Wrong plate!');}
}
function miss(s){hearts--;mult=1;shake=.25;flash=.25;say(s,1);beep(150,.3);lastPick=t;if(hearts<=0){state='over';best=Math.max(best,score);}}
function step(){
  t+=DT;
  if(showT>0){showT-=DT;if(showT<=0)lastPick=t;}
  else if(t-lastPick>2.0&&state==='play'){miss('Too slow!');}
  spawnT-=DT;if(spawnT<=0){spawn();spawnT=Math.max(.45,.8-served*.03);}
  beltOff=(beltOff+speed*DT)%40;
  for(var i=0;i<MAXP;i++){var p=plates[i];if(!p.on)continue;p.x+=speed*DT;if(p.x>W+30)p.on=false;}
  if(shake>0)shake-=DT;if(flash>0)flash-=DT;if(msgT>0)msgT-=DT;
  for(i=0;i<FMAX;i++){var f=floats[i];if(f.on){f.y-=30*DT;f.a-=DT;if(f.a<=0)f.on=false;}}
}
function icon(k,x,y,r){
  g.fillStyle='#fff';g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();
  g.fillStyle=COLS[k];
  if(k%3===0){g.beginPath();g.ellipse(x,y,r*.7,r*.45,0,0,6.2832);g.fill();}
  else if(k%3===1){g.fillRect(x-r*.55,y-r*.55,r*1.1,r*1.1);}
  else{g.beginPath();g.moveTo(x,y-r*.7);g.lineTo(x+r*.7,y+r*.6);g.lineTo(x-r*.7,y+r*.6);g.fill();}
  if(k>=3){g.strokeStyle='#222';g.lineWidth=3;g.strokeRect(x-r*.2,y-r*.2,r*.4,r*.4);}
}
var FC={};function fnt(sz){return FC[sz]||(FC[sz]='bold '+sz+'px system-ui,sans-serif');}
var sc={};function cs(k,v,f){var e=sc[k];if(!e||e.v!==v)e=sc[k]={v:v,s:f(v)};return e.s;}
function txt(s,x,y,sz,c,al){g.font=fnt(sz);g.fillStyle=c;g.textAlign=al||'center';g.fillText(s,x,y);}
function draw(){
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle=flash>0?'#6a2a3a':'#3b2440';g.fillRect(0,0,W,H);
  if(shake>0)g.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  // HUD
  for(var i=0;i<3;i++)txt(i<hearts?'♥':'♡',30+i*34,50,32,'#ff6b8a','left');
  txt(cs('sc',score,function(v){return 'Score '+v}),W-20,48,24,'#fff','right');
  // multiplier chopsticks
  txt(cs('mu',mult,function(v){return 'x'+v}),W/2,50,30,'#ffd166');
  for(i=0;i<5;i++){g.fillStyle=i<mult?'#ffd166':'#5a4560';g.fillRect(W/2-45+i*20,62,8,22);}
  // customer bubble
  g.fillStyle='#fff';g.beginPath();g.roundRect?g.roundRect(35,110,320,150,24):g.rect(35,110,320,150);g.fill();
  g.fillStyle='#222';
  if(state==='play'){
    if(showT>0){txt('Remember!',W/2,140,18,'#a33');}
    else txt(cs('or',oi*10+order.length,function(v){return 'Order '+((v/10)|0)+'/'+(v%10)+' — tap the next plate'}),W/2,140,15,'#555');
    for(i=0;i<order.length;i++){
      var x=W/2+(i-(order.length-1)/2)*62;
      if(showT>0)icon(order[i],x,200,24);
      else{g.fillStyle=i<oi?'#bfe8c5':'#ddd';g.beginPath();g.arc(x,200,24,0,6.2832);g.fill();if(i>=oi)txt('?',x,210,28,'#888');}
    }
    if(showT>0){g.fillStyle='#ffd166';g.fillRect(45,248,(300*showT/1.5),5);}
  }
  // belt
  g.fillStyle='#222';g.fillRect(0,360,W,150);
  g.fillStyle='#555';for(i=-1;i<W/40+1;i++)g.fillRect(i*40+beltOff,500,20,6);
  for(i=0;i<MAXP;i++){var p=plates[i];if(p.on)icon(p.k,p.x,435,32);}
  // legend
  txt('Tap plates on the belt',W/2,560,16,'#c9b5d0');
  txt('Fast pick (<0.5s) = +2 steps',W/2,586,14,'#9b86a3');
  for(i=0;i<FMAX;i++){var f=floats[i];if(f.on){g.globalAlpha=f.a;txt(f.s,f.x,f.y+90,20,'#fff');g.globalAlpha=1;}}
  if(msgT>0)txt(msg,W/2,700,30,'#ffd166');
  if(state==='title'){g.fillStyle='rgba(20,10,25,.85)';g.fillRect(0,0,W,H);txt('Conveyor Sushi',W/2,300,38,'#fff');txt('Memory',W/2,345,38,'#ffd166');
    txt('Glimpse the order,',W/2,420,20,'#ddd');txt('then grab it from the belt.',W/2,448,20,'#ddd');txt('TAP TO START',W/2,560,28,'#7bdc8f');}
  if(state==='over'){g.fillStyle='rgba(20,10,25,.88)';g.fillRect(0,0,W,H);txt('Shift over',W/2,300,38,'#fff');txt(cs('sc',score,function(v){return 'Score '+v}),W/2,360,28,'#ffd166');txt(cs('bs',best*1000+served,function(v){return 'Best '+((v/1000)|0)+' · Served '+(v%1000)}),W/2,400,20,'#ddd');
    g.fillStyle='#7bdc8f';g.fillRect(95,480,200,64);txt('AGAIN',W/2,523,28,'#133');}
}
function frame(ts){
  var n=ts/1000;if(!last)last=n;var d=n-last;last=n;if(d>.1)d=.1;
  if(state==='play'){acc+=d;while(acc>=DT){step();acc-=DT;}}
  draw();requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();ac();if(audio&&audio.state==='suspended')try{audio.resume()}catch(_){}
  var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(state==='title'){reset();return}
  if(state==='over'){if(y>440)reset();return}
  if(showT>0)return;
  var bi=-1,bd=1e9;
  for(var i=0;i<MAXP;i++){var p=plates[i];if(!p.on)continue;var dx=x-p.x,dy=y-435;var d2=dx*dx+dy*dy;if(Math.abs(dx)<44&&Math.abs(dy)<70&&d2<bd){bd=d2;bi=i}}
  if(bi>=0)pick(plates[bi]);
});
requestAnimationFrame(frame);
})();
</script></body></html>

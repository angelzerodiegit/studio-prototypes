<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Glass Blower Rush</title>
<style>
html,body{margin:0;height:100%;background:#120a1e;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

/* ===== Constants ===== */
var W = 390, H = 844, CX = 195;
var STEP = 1 / 120;                 // fixed update step (120 Hz)
var ROW0_Y = 700, ROW_H = 78, ROWS = 6;
var START_W = 20;                   // blob width at the start of each row
var MAX_BURSTS = 3;                 // spare blobs
var VASE_TIME = 30;                 // seconds per vase (bonus timer)
var G_TOL = 15;                     // Good window (+/- px of width)
var P_TOL_BASE = 5.5;               // Perfect window (+/- px), shrinks to 4 on later vases
var PTS_PERFECT = 100, PTS_GOOD = 50, PTS_THIN = 10;
var VASE_BONUS = 150, VASE_BONUS_FLAWLESS = 500, TIME_BONUS_PER_SEC = 10;
var COOL_TIME = 7;                  // seconds for a frozen row to cool orange -> blue
var SHELF_MAX = 10;
var HEAT_LO = 0.55, HEAT_HI = 0.9;  // workable heat band (glass only fuses cleanly inside it)
var HEAT_TOP = 215, HEAT_BOT = 640; // thermometer extents on screen
var vsKey = -1, vsStr = '';

var VASES = [
  { name: 'Round Amphora', w: [84, 120, 140, 116, 80, 62] },
  { name: 'Tall Flute',    w: [60, 72, 84, 72, 60, 56] },
  { name: 'Wide Bowl',     w: [70, 110, 144, 164, 176, 182] },
  { name: 'Hourglass',     w: [140, 100, 70, 60, 96, 138] },
  { name: 'Gourd',         w: [90, 128, 100, 70, 92, 58] }
];

var S_TITLE = 0, S_PLAY = 1, S_OVER = 2;
var P_READY = 0, P_HOLD = 1, P_FREEZE = 2, P_BURST = 3, P_DONE = 4;

var FF = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
var F14 = '14px ' + FF, F15B = 'bold 15px ' + FF, F18B = 'bold 18px ' + FF, F20B = 'bold 20px ' + FF;
var F24B = 'bold 24px ' + FF, F26B = 'bold 26px ' + FF, F30B = 'bold 30px ' + FF, F34B = 'bold 34px ' + FF;
var F40B = 'bold 40px ' + FF, F54B = 'bold 54px ' + FF, F64B = 'bold 64px ' + FF, F17 = '17px ' + FF;

var PCOL = ['#ffb43a', '#ffe9a8', '#7dff9e', '#ffffff', '#8fd3ff', '#ff5a4a', '#ffd35a', '#ff7ad9'];
var MULT_STR = ['x1', 'x2', 'x3', 'x5'];
var MULT_VAL = [1, 2, 3, 5];
var MULT_COL = ['#9fb4c8', '#ffe066', '#ff9a3a', '#ff4fd8'];
var POP_TEXT = ['PERFECT!', 'GOOD', 'THIN', 'BURST!', 'MULTIPLIER UP!'];
var POP_COL = ['#7dff9e', '#ffe066', '#b6c6d6', '#ff5a4a', '#ff9de8'];
var FLASH_COL = ['#ff3b30', '#ffffff', '#9fe6ff'];
var DASH = [7, 7], NODASH = [];
var VIB_BURST = [45, 30, 70], VIB_DONE = [20, 40, 20, 40, 60];
var HINT_STR = 'Release on the green line while heat is in the band';
var HEATC = [];
(function () { for (var i = 0; i <= 16; i++) { var f = i / 16; HEATC.push('rgb(' + Math.round(150 + 105 * f) + ',' + Math.round(150 - 30 * f + (f > 0.8 ? 100 * (f - 0.8) : 0)) + ',' + Math.round(235 - 200 * f) + ')'); } })();

/* ===== Canvas / scaling ===== */
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var cssScale = 1;
function resize() {
  var iw = window.innerWidth || W, ih = window.innerHeight || H;
  cssScale = Math.min(iw / W, ih / H);
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = (W * cssScale) + 'px';
  cv.style.height = (H * cssScale) + 'px';
  cv.width = Math.max(1, Math.round(W * cssScale * dpr));
  cv.height = Math.max(1, Math.round(H * cssScale * dpr));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

/* ===== Precomputed palettes ===== */
var COOL = [];   // orange -> clear blue, 33 steps
(function () {
  for (var i = 0; i <= 32; i++) {
    var f = i / 32;
    var r = Math.round(255 + (140 - 255) * f);
    var g = Math.round(140 + (214 - 140) * f);
    var b = Math.round(36 + (255 - 36) * f);
    COOL.push('rgb(' + r + ',' + g + ',' + b + ')');
  }
})();
var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
bgGrad.addColorStop(0, '#150c28');
bgGrad.addColorStop(0.6, '#2a1431');
bgGrad.addColorStop(1, '#4a1d2a');

/* ===== Persistent data (best, shelf) ===== */
var best = 0;
var shelf = new Uint8Array(SHELF_MAX * 7);   // per vase: [flawless, w0..w5]
var shelfN = 0;
function loadSave() {
  try {
    var b = window.localStorage.getItem('gbr_best');
    if (b) best = parseInt(b, 10) || 0;
    var s = window.localStorage.getItem('gbr_shelf');
    if (s) {
      var parts = s.split(',');
      var n = Math.min(Math.floor(parts.length / 7), SHELF_MAX);
      for (var i = 0; i < n * 7; i++) shelf[i] = parseInt(parts[i], 10) || 0;
      shelfN = n;
    }
  } catch (e) { /* storage unavailable */ }
}
function saveData() {
  try {
    window.localStorage.setItem('gbr_best', String(best));
    window.localStorage.setItem('gbr_shelf', Array.prototype.join.call(shelf.subarray(0, shelfN * 7), ','));
  } catch (e) { /* ignore */ }
}
loadSave();

/* ===== Audio (synth, created only after first tap) ===== */
var actx = null, master = null, blowOsc = null, blowGain = null;
function initAudio() {
  try {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.5;
    master.connect(actx.destination);
    blowOsc = actx.createOscillator();
    blowOsc.type = 'triangle';
    blowGain = actx.createGain();
    blowGain.gain.value = 0;
    blowOsc.connect(blowGain);
    blowGain.connect(master);
    blowOsc.start();
  } catch (e) { actx = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!actx) return;
  try {
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* ignore */ }
}
function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* ignore */ } }

/* ===== Game state ===== */
var scene = S_TITLE, pstate = P_READY;
var tNow = 0, overT = 0;
var score = 0, scoreStr = '0', bestStr = '0', bestLbl = 'BEST 0';
var streak = 0, multI = 0, mult = 1, runBestMultI = 0;
var bursts = 0, vasesDone = 0, vaseIdx = 0, newBest = false;
var row = 0, nFrozen = 0;
var base = START_W, ampCur = 2, phase = 0, dw = START_W;
var blobY = ROW0_Y, ptimer = 0, bubT = 0;
var vaseTime = VASE_TIME, flawless = true;
var P = P_TOL_BASE, amp = 6, wobF = 7, grow = 62;
var tw = 84, defW = VASES[0].w;
var infoStr = '', doneStr1 = 'VASE COMPLETE', doneStr2 = '', flawStr = 'FLAWLESS! +1 spare blob';
var downFlag = false, armed = false, activeId = -1;
var hintOn = true, hintT = 0;
var shake = 0, flashA = 0, flashC = 0, multPulse = 0, scorePulse = 0, spareFlash = 0;
var lastFlawless = false;
var heatPh = -0.2, heatW = 2.0, heat = 0.5, heatOK = false, heatHint = 0;

var curW = new Float32Array(ROWS);
var rowAge = new Float32Array(ROWS);
var rowGrade = new Uint8Array(ROWS);

/* particle pool */
var PN = 260, pIdx = 0;
var px = new Float32Array(PN), py = new Float32Array(PN), pvx = new Float32Array(PN), pvy = new Float32Array(PN);
var pl = new Float32Array(PN), pml = new Float32Array(PN), ps = new Float32Array(PN), pg = new Float32Array(PN);
var pc = new Uint8Array(PN);
/* ring pool */
var RN = 6, rIdx = 0;
var rx = new Float32Array(RN), ry = new Float32Array(RN), rr = new Float32Array(RN), rl = new Float32Array(RN), rc = new Uint8Array(RN);
/* popup pool */
var UN = 8, uIdx = 0;
var ux = new Float32Array(UN), uy = new Float32Array(UN), ul = new Float32Array(UN), uk = new Uint8Array(UN), usz = new Float32Array(UN);
var ustr = new Array(UN);
for (var ui = 0; ui < UN; ui++) ustr[ui] = '';
/* ambient embers */
var EN = 26;
var ex = new Float32Array(EN), ey = new Float32Array(EN), evy = new Float32Array(EN), esz = new Float32Array(EN);
for (var ei = 0; ei < EN; ei++) { ex[ei] = Math.random() * W; ey[ei] = Math.random() * H; evy[ei] = 10 + Math.random() * 22; esz[ei] = 1 + Math.random() * 2.2; }

function rowY(r) { return ROW0_Y - r * ROW_H; }
function tierOf(s) { return s >= 5 ? 3 : (s >= 3 ? 2 : (s >= 1 ? 1 : 0)); }

/* ===== FX helpers ===== */
function spawnP(x, y, vx, vy, life, size, c, g) {
  var i = pIdx; pIdx = (pIdx + 1) % PN;
  px[i] = x; py[i] = y; pvx[i] = vx; pvy[i] = vy; pl[i] = life; pml[i] = life; ps[i] = size; pc[i] = c; pg[i] = g;
}
function burstP(x, y, n, spd, life, size, c0, c1, g) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * 6.2832, s = spd * (0.3 + Math.random() * 0.7);
    spawnP(x, y, Math.cos(a) * s, Math.sin(a) * s - spd * 0.2, life * (0.6 + Math.random() * 0.6), size * (0.6 + Math.random() * 0.8), Math.random() < 0.5 ? c0 : c1, g);
  }
}
function spawnRing(x, y, c) {
  var i = rIdx; rIdx = (rIdx + 1) % RN;
  rx[i] = x; ry[i] = y; rr[i] = 10; rl[i] = 0.45; rc[i] = c;
}
function popup(kind, x, y, str, size) {
  var i = uIdx; uIdx = (uIdx + 1) % UN;
  ux[i] = x; uy[i] = y; ul[i] = 1.0; uk[i] = kind; usz[i] = size; ustr[i] = str;
}

/* ===== Game flow ===== */
function addScore(n) {
  score += n;
  scoreStr = String(score);
  scorePulse = 1;
}
function setupVase() {
  var v = vaseIdx, def = VASES[v % VASES.length];
  heatW = 2.0 + 0.15 * Math.min(v, 6);
  defW = def.w;
  row = 0; nFrozen = 0; base = START_W; dw = START_W; ampCur = 2;
  blobY = rowY(0); pstate = P_READY; ptimer = 0;
  vaseTime = VASE_TIME; flawless = true;
  var d = Math.min(v, 8);
  wobF = 7 + 1.1 * d;
  amp = Math.min(6 + v, 12);
  P = P_TOL_BASE - 0.3 * Math.min(v, 5);
  grow = 62 + 4 * d;
  tw = defW[0];
  infoStr = 'VASE ' + (v + 1) + '  ·  ' + def.name.toUpperCase();
  for (var i = 0; i < ROWS; i++) { rowAge[i] = 0; curW[i] = 0; rowGrade[i] = 0; }
}
function startRun() {
  score = 0; scoreStr = '0'; bestStr = String(best); bestLbl = 'BEST ' + bestStr;
  streak = 0; multI = 0; mult = 1; runBestMultI = 0;
  bursts = 0; vasesDone = 0; vaseIdx = 0; newBest = false;
  hintOn = true; hintT = 0; heatPh = -0.2; shake = 0; flashA = 0; spareFlash = 0;
  for (var i = 0; i < PN; i++) pl[i] = 0;
  for (i = 0; i < UN; i++) ul[i] = 0;
  setupVase();
  scene = S_PLAY;
  tone(330, 660, 0.18, 'triangle', 0.2);
}
function beginHold() {
  pstate = P_HOLD; armed = false;
  base = START_W; ampCur = 2; bubT = 0;
}
function burst() {
  var x = CX, y = rowY(row);
  bursts++;
  streak = 0; multI = 0; mult = 1; flawless = false;
  shake = 16; flashA = 0.4; flashC = 0; spareFlash = 1;
  burstP(x, y, 36, 260, 0.9, 5, 0, 5, 520);
  burstP(x, y, 16, 140, 0.7, 4, 3, 4, 420);
  spawnRing(x, y, 5);
  popup(3, x, y - 50, POP_TEXT[3], 40);
  vib(VIB_BURST);
  tone(520, 70, 0.35, 'sawtooth', 0.22);
  tone(1800, 300, 0.18, 'square', 0.08);
  pstate = P_BURST; ptimer = 0.75;
  if (blowGain) blowGain.gain.value = 0;
}
function freezeRow(grade) {
  var y = rowY(row), x = CX;
  curW[row] = dw; rowAge[row] = 0; rowGrade[row] = grade; nFrozen = row + 1;
  var pts;
  if (grade === 1) {
    streak++;
    var nm = tierOf(streak);
    var up = nm > multI;
    multI = nm; mult = MULT_VAL[multI];
    if (multI > runBestMultI) runBestMultI = multI;
    pts = PTS_PERFECT * mult;
    addScore(pts);
    popup(0, x, y - 46, POP_TEXT[0] + ' +' + pts, 30);
    burstP(x, y, 22, 210, 0.8, 4, 1, 6, 120);
    spawnRing(x, y, 2);
    flashA = 0.16; flashC = 1; shake = 3;
    tone(520 + 110 * streak, 780 + 130 * streak, 0.16, 'triangle', 0.22);
    tone(1040 + 200 * streak, 1400 + 200 * streak, 0.12, 'sine', 0.08, 0.05);
    vib(18);
    if (up) {
      multPulse = 1;
      popup(4, x, y - 92, POP_TEXT[4] + ' ' + MULT_STR[multI], 26);
      burstP(CX, 52, 24, 180, 0.7, 4, 6, 7, 60);
      tone(660, 1320, 0.28, 'square', 0.1, 0.08);
    }
  } else if (grade === 2) {
    pts = PTS_GOOD * mult;
    addScore(pts);
    flawless = false;
    if (!heatOK) { streak = 0; multI = 0; mult = 1; }
    var gl = heatOK ? POP_TEXT[1] : (heat < HEAT_LO ? 'TOO COLD' : 'TOO HOT');
    popup(1, x, y - 46, gl + ' +' + pts, 26);
    burstP(x, y, 10, 140, 0.6, 3, 0, 4, 120);
    shake = 2;
    tone(440, 540, 0.14, 'triangle', 0.2);
    vib(10);
  } else {
    streak = 0; multI = 0; mult = 1; flawless = false;
    addScore(PTS_THIN);
    popup(2, x, y - 46, POP_TEXT[2], 26);
    burstP(x, y, 6, 90, 0.5, 3, 4, 4, 100);
    tone(260, 200, 0.14, 'sine', 0.18);
  }
  if (grade === 1 || grade === 2) { /* label shown through the +pts popup colour */ }
  pstate = P_FREEZE; ptimer = 0.3;
  hintOn = false;
  if (blowGain) blowGain.gain.value = 0;
}
function doRelease() {
  var d = dw - tw;
  var ad = d < 0 ? -d : d;
  if (d > G_TOL) { burst(); return; }
  if (ad <= P) freezeRow(heatOK ? 1 : 2);
  else if (ad <= G_TOL) freezeRow(2);
  else freezeRow(3);
}
function finishVase() {
  vasesDone++;
  var bonus = (flawless ? VASE_BONUS_FLAWLESS : VASE_BONUS) + Math.floor(vaseTime) * TIME_BONUS_PER_SEC;
  addScore(bonus);
  doneStr2 = VASES[vaseIdx % VASES.length].name + '  +' + bonus;
  lastFlawless = flawless;
  if (flawless && bursts > 0) { bursts--; spareFlash = 1; }
  if (shelfN >= SHELF_MAX) { shelf.copyWithin(0, 7); shelfN = SHELF_MAX - 1; }
  var o = shelfN * 7;
  shelf[o] = flawless ? 1 : 0;
  for (var i = 0; i < ROWS; i++) shelf[o + 1 + i] = Math.max(0, Math.min(255, Math.round(curW[i])));
  shelfN++;
  saveData();
  pstate = P_DONE; ptimer = 2.1;
  burstP(CX, 400, 60, 320, 1.3, 5, 6, 7, 260);
  burstP(CX, 500, 30, 240, 1.1, 4, 2, 4, 220);
  spawnRing(CX, 480, 4);
  flashA = 0.2; flashC = 2;
  vib(VIB_DONE);
  tone(523, 523, 0.12, 'triangle', 0.2);
  tone(659, 659, 0.12, 'triangle', 0.2, 0.1);
  tone(784, 784, 0.12, 'triangle', 0.2, 0.2);
  tone(1047, 1047, 0.3, 'triangle', 0.22, 0.3);
}
function gameOver() {
  scene = S_OVER; overT = 0;
  if (score > best) { best = score; newBest = true; }
  bestStr = String(best); bestLbl = 'BEST ' + bestStr;
  saveData();
  pstate = P_READY;
  if (blowGain) blowGain.gain.value = 0;
  tone(300, 90, 0.6, 'sawtooth', 0.18);
}

/* ===== Update (fixed step) ===== */
function update(dt) {
  tNow += dt;
  phase += dt * (scene === S_PLAY ? wobF : 3);
  heatPh += dt * heatW;
  heat = 0.5 + 0.5 * Math.sin(heatPh);
  heatOK = heat >= HEAT_LO && heat <= HEAT_HI;
  if (shake > 0) { shake -= dt * 40; if (shake < 0) shake = 0; }
  if (flashA > 0) { flashA -= dt * 1.2; if (flashA < 0) flashA = 0; }
  if (multPulse > 0) { multPulse -= dt * 2.5; if (multPulse < 0) multPulse = 0; }
  if (scorePulse > 0) { scorePulse -= dt * 4; if (scorePulse < 0) scorePulse = 0; }
  if (spareFlash > 0) { spareFlash -= dt * 1.4; if (spareFlash < 0) spareFlash = 0; }
  var i;
  for (i = 0; i < PN; i++) {
    if (pl[i] > 0) {
      pl[i] -= dt;
      pvy[i] += pg[i] * dt;
      px[i] += pvx[i] * dt; py[i] += pvy[i] * dt;
    }
  }
  for (i = 0; i < RN; i++) { if (rl[i] > 0) { rl[i] -= dt; rr[i] += 190 * dt; } }
  for (i = 0; i < UN; i++) { if (ul[i] > 0) { ul[i] -= dt * 0.85; uy[i] -= 38 * dt; } }
  for (i = 0; i < EN; i++) { ey[i] -= evy[i] * dt; ex[i] += Math.sin(tNow + i) * 6 * dt; if (ey[i] < -4) { ey[i] = H + 4; ex[i] = Math.random() * W; } }

  if (scene === S_TITLE) {
    dw = 110 + 16 * Math.sin(tNow * 3);
    return;
  }
  if (scene === S_OVER) { overT += dt; return; }

  for (i = 0; i < nFrozen; i++) rowAge[i] += dt;
  var k = 1 - Math.exp(-dt * 16);
  blobY += (rowY(row < ROWS ? row : ROWS - 1) - blobY) * k;

  if (pstate === P_READY || pstate === P_HOLD) {
    vaseTime -= dt; if (vaseTime < 0) vaseTime = 0;
  }
  tw = defW[row < ROWS ? row : ROWS - 1];

  if (pstate === P_READY) {
    base = START_W;
    ampCur += (2 - ampCur) * Math.min(1, dt * 8);
    dw = base + ampCur * Math.sin(phase);
    if (armed && downFlag) beginHold();
  } else if (pstate === P_HOLD) {
    base += grow * (0.55 + 0.9 * heat) * dt;
    ampCur += (amp - ampCur) * Math.min(1, dt * 8);
    dw = base + ampCur * Math.sin(phase);
    bubT -= dt;
    if (bubT <= 0) {
      bubT = 0.045;
      spawnP(CX + (Math.random() - 0.5) * dw * 0.7, blobY - 20, (Math.random() - 0.5) * 30, -60 - Math.random() * 50, 0.6, 2.5, Math.random() < 0.5 ? 1 : 0, -20);
    }
    if (base - ampCur > tw + G_TOL) burst();
    else if (!downFlag) doRelease();
  } else if (pstate === P_FREEZE) {
    ptimer -= dt;
    if (ptimer <= 0) {
      row++;
      if (row >= ROWS) finishVase();
      else { pstate = P_READY; base = START_W; ampCur = 2; }
    }
  } else if (pstate === P_BURST) {
    ptimer -= dt;
    if (ptimer <= 0) {
      if (bursts >= MAX_BURSTS) gameOver();
      else { pstate = P_READY; base = START_W; ampCur = 2; }
    }
  } else if (pstate === P_DONE) {
    ptimer -= dt;
    if (ptimer <= 0) { vaseIdx++; setupVase(); }
  }
}

/* ===== Render helpers ===== */
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, font, color, align) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'center';
  ctx.fillText(s, x, y);
}
function coolIdx(age) { var c = (age / COOL_TIME) * 32; return c > 32 ? 32 : (c | 0); }

/* Draws a stack of glass rows. arr[off+i] = full width of row i. live => colour from row age. */
function drawVaseShape(arr, off, n, cx, baseY, rs, ws, hh, live) {
  var i, a, b, y0, y1;
  ctx.globalAlpha = 1;
  for (i = 0; i < n - 1; i++) {
    ctx.fillStyle = COOL[live ? coolIdx(rowAge[i + 1]) : 32];
    a = arr[off + i] * ws * 0.5; b = arr[off + i + 1] * ws * 0.5;
    y0 = baseY - i * rs; y1 = y0 - rs;
    ctx.beginPath();
    ctx.moveTo(cx - a, y0); ctx.lineTo(cx - b, y1); ctx.lineTo(cx + b, y1); ctx.lineTo(cx + a, y0);
    ctx.closePath(); ctx.fill();
  }
  for (i = 0; i < n; i++) {
    a = arr[off + i] * ws * 0.5; y0 = baseY - i * rs;
    ctx.fillStyle = COOL[live ? coolIdx(rowAge[i]) : 32];
    ctx.beginPath(); ctx.ellipse(cx, y0, a, hh, 0, 0, 6.2832); ctx.fill();
    if (live && rowAge[i] < 0.6) {
      ctx.globalAlpha = (0.6 - rowAge[i]) * 1.2;
      ctx.fillStyle = '#fff4cc';
      ctx.beginPath(); ctx.ellipse(cx, y0, a * 0.9, hh * 0.8, 0, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = live ? 2 : 1;
    ctx.beginPath(); ctx.ellipse(cx, y0, a * 0.82, hh * 0.78, 0, 3.5, 4.5); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawPipe(x, y, w) {
  ctx.fillStyle = '#6b7885';
  ctx.fillRect(x + w * 0.4, y - 8, W - (x + w * 0.4) + 6, 16);
  ctx.fillStyle = '#b8c4d0';
  ctx.fillRect(x + w * 0.4, y - 6, W - (x + w * 0.4) + 6, 4);
  ctx.fillStyle = '#4b5663';
  ctx.fillRect(W - 40, y - 13, 40, 26);
}

function drawBlob(x, y, w, zone) {
  var hh = 30 + w * 0.05;
  ctx.globalAlpha = heatOK ? 0.34 : 0.2; ctx.fillStyle = heatOK ? '#7dff9e' : '#ff9a2a';
  ctx.beginPath(); ctx.ellipse(x, y, w / 2 + 16, hh + 14, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 0.95; ctx.fillStyle = HEATC[(heat * 16) | 0];
  ctx.beginPath(); ctx.ellipse(x, y, w / 2, hh, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 0.85; ctx.fillStyle = '#ffe9a8';
  ctx.beginPath(); ctx.ellipse(x - w * 0.06, y - hh * 0.15, w * 0.3, hh * 0.5, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  if (zone) {
    ctx.strokeStyle = zone; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(x, y, w / 2, hh, 0, 0, 6.2832); ctx.stroke();
  }
}

function drawShelf(y0, gap, label) {
  txt(label, CX, y0 - 52, F15B, '#c7b7e6', 'center');
  var i, r, c;
  var rowsNeeded = shelfN > 5 ? 2 : 1;
  for (r = 0; r < 2; r++) {
    var by = y0 + r * gap;
    ctx.fillStyle = r < rowsNeeded || shelfN === 0 ? '#7a4a2a' : '#4a2c1a';
    ctx.fillRect(14, by + 4, W - 28, 6);
    ctx.fillStyle = '#a0683c';
    ctx.fillRect(14, by + 4, W - 28, 2);
  }
  if (shelfN === 0) {
    txt('Empty shelf. Blow your first vase!', CX, y0 - 14, F14, '#9c8cc0', 'center');
    return;
  }
  for (i = 0; i < shelfN; i++) {
    r = (i / 5) | 0; c = i % 5;
    var cx = 39 + c * 78, by2 = y0 + r * gap;
    var o = i * 7;
    if (shelf[o] === 1) {
      ctx.globalAlpha = 0.25 + 0.1 * Math.sin(tNow * 4 + i);
      ctx.fillStyle = '#ffd35a';
      ctx.beginPath(); ctx.ellipse(cx, by2 - 22, 36, 34, 0, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawVaseShape(shelf, o + 1, ROWS, cx, by2 - 4, 7.5, 0.26, 5, false);
  }
}

function drawButton(x, y, w, h, label, pulse) {
  var s = 1 + (pulse ? 0.04 * Math.sin(tNow * 6) : 0);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  rrect(-w / 2, -h / 2, w, h, h / 2);
  ctx.fillStyle = '#ff8a1f'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#ffd08a'; ctx.stroke();
  txt(label, 0, 9, F26B, '#2a1200', 'center');
  ctx.restore();
}

/* ===== Render ===== */
function drawTarget() {
  var i, y;
  ctx.lineWidth = 2;
  ctx.setLineDash(DASH);
  ctx.strokeStyle = 'rgba(190,225,255,0.38)';
  ctx.beginPath();
  ctx.moveTo(CX - defW[0] / 2, rowY(0));
  for (i = 1; i < ROWS; i++) ctx.lineTo(CX - defW[i] / 2, rowY(i));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(CX + defW[0] / 2, rowY(0));
  for (i = 1; i < ROWS; i++) ctx.lineTo(CX + defW[i] / 2, rowY(i));
  ctx.stroke();
  ctx.setLineDash(NODASH);
  ctx.strokeStyle = 'rgba(190,225,255,0.16)';
  ctx.beginPath();
  for (i = 0; i < ROWS; i++) { y = rowY(i); ctx.moveTo(CX - defW[i] / 2, y); ctx.lineTo(CX + defW[i] / 2, y); }
  ctx.stroke();
}
function drawZones(y, w) {
  var half = w / 2, pulse = 0.6 + 0.4 * Math.sin(tNow * 7);
  // Good band then Perfect band on both sides
  ctx.fillStyle = 'rgba(255,224,102,0.18)';
  ctx.fillRect(CX - half - G_TOL / 2, y - 36, G_TOL, 72);
  ctx.fillRect(CX + half - G_TOL / 2, y - 36, G_TOL, 72);
  ctx.fillStyle = '#5eff96';
  ctx.globalAlpha = 0.22 + 0.12 * pulse;
  ctx.fillRect(CX - half - P / 2, y - 36, P, 72);
  ctx.fillRect(CX + half - P / 2, y - 36, P, 72);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#7dff9e';
  ctx.fillRect(CX - half - 1.5, y - 40, 3, 80);
  ctx.fillRect(CX + half - 1.5, y - 40, 3, 80);
  // arrows pointing at the line
  var ax = 14 + 4 * pulse;
  ctx.beginPath();
  ctx.moveTo(CX - half - G_TOL - ax - 12, y - 10); ctx.lineTo(CX - half - G_TOL - ax + 2, y); ctx.lineTo(CX - half - G_TOL - ax - 12, y + 10);
  ctx.moveTo(CX + half + G_TOL + ax + 12, y - 10); ctx.lineTo(CX + half + G_TOL + ax - 2, y); ctx.lineTo(CX + half + G_TOL + ax + 12, y + 10);
  ctx.fill();
}

function drawHeat() {
  var x = 14, w = 22, h = HEAT_BOT - HEAT_TOP, yb = HEAT_BOT;
  txt('HEAT', x + w / 2, HEAT_TOP - 12, F14, '#b9a8dc', 'center');
  rrect(x, HEAT_TOP, w, h, 11); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
  var by0 = yb - HEAT_HI * h, by1 = yb - HEAT_LO * h;
  ctx.globalAlpha = heatOK ? 0.9 : 0.5 + 0.2 * Math.sin(tNow * 8);
  ctx.fillStyle = '#5eff96'; ctx.fillRect(x - 3, by0, w + 6, by1 - by0);
  ctx.globalAlpha = 1;
  var my = yb - heat * h;
  ctx.fillStyle = HEATC[(heat * 16) | 0];
  ctx.beginPath(); ctx.arc(x + w / 2, my, 13, 0, 6.2832); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = heatOK ? '#ffffff' : 'rgba(255,255,255,0.5)'; ctx.stroke();
  txt('FUSE', x + w / 2, by0 - 6, F14, '#7dff9e', 'center');
  txt(heatOK ? 'GO' : (heat < HEAT_LO ? 'COLD' : 'HOT'), x + w / 2, yb + 22, F14, heatOK ? '#7dff9e' : '#ffb36a', 'center');
}

function drawHUD() {
  var i;
  txt('SCORE', 20, 30, F14, '#b9a8dc', 'left');
  var sp = 1 + scorePulse * 0.18;
  ctx.save(); ctx.translate(20, 66); ctx.scale(sp, sp);
  txt(scoreStr, 0, 0, F34B, '#ffffff', 'left');
  ctx.restore();

  // multiplier badge
  var ms = 1 + multPulse * 0.45 + 0.03 * Math.sin(tNow * 5) * (multI > 0 ? 1 : 0);
  ctx.save(); ctx.translate(CX, 50); ctx.scale(ms, ms);
  ctx.beginPath(); ctx.arc(0, 0, 31, 0, 6.2832);
  ctx.fillStyle = 'rgba(20,10,40,0.85)'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = MULT_COL[multI]; ctx.stroke();
  txt(MULT_STR[multI], 0, 11, F30B, MULT_COL[multI], 'center');
  ctx.restore();
  for (i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.arc(CX - 32 + i * 16, 94, 4.5, 0, 6.2832);
    ctx.fillStyle = i < streak ? '#7dff9e' : 'rgba(255,255,255,0.18)'; ctx.fill();
  }

  // spare blobs
  txt('SPARE', W - 20, 30, F14, '#b9a8dc', 'right');
  for (i = 0; i < MAX_BURSTS; i++) {
    var sx = W - 92 + i * 36, alive = i < MAX_BURSTS - bursts;
    ctx.beginPath(); ctx.arc(sx, 58, 13 + (alive ? 0 : 0), 0, 6.2832);
    if (alive) {
      ctx.fillStyle = '#ffa933'; ctx.fill();
      ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(sx - 3, 54, 5, 0, 6.2832); ctx.fill();
    } else {
      ctx.lineWidth = 2; ctx.strokeStyle = '#ff5a4a'; ctx.globalAlpha = 0.45 + 0.5 * spareFlash; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - 6, 52); ctx.lineTo(sx + 6, 64); ctx.moveTo(sx + 6, 52); ctx.lineTo(sx - 6, 64); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // vase info + timer bar
  txt(infoStr, CX, 128, F15B, '#e4dcf7', 'center');
  rrect(20, 138, W - 40, 8, 4); ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill();
  var f = vaseTime / VASE_TIME;
  if (f > 0.004) {
    rrect(20, 138, (W - 40) * f, 8, 4);
    ctx.fillStyle = f < 0.2 ? (Math.sin(tNow * 14) > 0 ? '#ff5a4a' : '#ffb0a8') : '#8fd3ff'; ctx.fill();
  }
}

function render() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  var i;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 2 * shake, (Math.random() - 0.5) * 2 * shake);

  // furnace glow grows with multiplier
  ctx.globalAlpha = 0.12 + 0.08 * multI + 0.03 * Math.sin(tNow * 3);
  ctx.fillStyle = '#ff7a2a';
  ctx.beginPath(); ctx.ellipse(CX, H + 40, 320, 300, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  // embers
  ctx.fillStyle = '#ffb36a';
  for (i = 0; i < EN; i++) { ctx.globalAlpha = 0.25 + 0.2 * Math.sin(tNow * 2 + i); ctx.fillRect(ex[i], ey[i], esz[i], esz[i]); }
  ctx.globalAlpha = 1;
  // work table
  ctx.fillStyle = '#5a3320'; ctx.fillRect(0, 742, W, 14);
  ctx.fillStyle = '#7c4a2d'; ctx.fillRect(0, 742, W, 4);

  if (scene === S_TITLE) {
    drawPipe(CX, 360, dw);
    drawBlob(CX, 360, dw, null);
  } else {
    drawTarget();
    if (pstate === P_READY || pstate === P_HOLD || pstate === P_BURST) drawZones(rowY(row), tw);
    if (nFrozen > 0) drawVaseShape(curW, 0, nFrozen, CX, ROW0_Y, ROW_H, 1, 31, true);
    if (pstate === P_READY || pstate === P_HOLD) {
      var d = dw - tw, ad = d < 0 ? -d : d;
      var zone = (pstate === P_HOLD) ? (ad <= P ? '#5cff9a' : (ad <= G_TOL ? '#ffe066' : (d > G_TOL ? '#ff4a4a' : null))) : null;
      drawPipe(CX, blobY, dw);
      drawBlob(CX, blobY, dw, zone);
    }
    if (pstate === P_BURST) {
      ctx.globalAlpha = Math.max(0, ptimer * 1.2);
      drawPipe(CX, blobY, 60);
      ctx.globalAlpha = 1;
    }
  }

  // particles
  for (i = 0; i < PN; i++) {
    if (pl[i] > 0) {
      var a = pl[i] / pml[i] * 1.6; ctx.globalAlpha = a > 1 ? 1 : a;
      ctx.fillStyle = PCOL[pc[i]];
      ctx.fillRect(px[i] - ps[i] * 0.5, py[i] - ps[i] * 0.5, ps[i], ps[i]);
    }
  }
  ctx.globalAlpha = 1;
  // rings
  ctx.lineWidth = 4;
  for (i = 0; i < RN; i++) {
    if (rl[i] > 0) {
      ctx.globalAlpha = rl[i] / 0.45; ctx.strokeStyle = PCOL[rc[i]];
      ctx.beginPath(); ctx.arc(rx[i], ry[i], rr[i], 0, 6.2832); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // flash
  if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = FLASH_COL[flashC]; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

  if (scene === S_PLAY) {
    drawHUD();
    drawHeat();
    // popups
    for (i = 0; i < UN; i++) {
      if (ul[i] > 0) {
        var pa = ul[i] * 2.2; ctx.globalAlpha = pa > 1 ? 1 : pa;
        var sc = 1 + Math.max(0, ul[i] - 0.8) * 2;
        ctx.save(); ctx.translate(ux[i], uy[i]); ctx.scale(sc, sc);
        txt(ustr[i], 0, 0, usz[i] > 30 ? F34B : F26B, POP_COL[uk[i]], 'center');
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    // kind labels (Perfect / Good) shown above the score popup
    if (pstate === P_DONE) {
      var ba = Math.min(1, (2.1 - ptimer) * 4);
      ctx.globalAlpha = ba;
      rrect(25, 175, W - 50, lastFlawless ? 130 : 96, 18); ctx.fillStyle = 'rgba(20,10,40,0.82)'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#8fd3ff'; ctx.stroke();
      txt(doneStr1, CX, 220, F30B, '#8fe3ff', 'center');
      txt(doneStr2, CX, 254, F20B, '#ffffff', 'center');
      if (lastFlawless) txt(flawStr, CX, 290, F18B, '#ffd35a', 'center');
      ctx.globalAlpha = 1;
    }
    // hint
    if (hintOn && pstate !== P_DONE) {
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(tNow * 5);
      txt(HINT_STR, CX, 188, F15B, '#ffffff', 'center');
      ctx.globalAlpha = 1;
    }
    // hold pad (whole screen is the touch target)
    var holding = pstate === P_HOLD;
    rrect(85, 772, 220, 56, 28);
    ctx.fillStyle = holding ? '#ff8a1f' : 'rgba(255,255,255,0.1)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = holding ? '#ffd08a' : 'rgba(255,255,255,0.45)'; ctx.stroke();
    txt(holding ? (heatOK ? 'RELEASE!' : 'WAIT FOR GO') : 'HOLD TO BLOW', CX, 808, F20B, holding ? '#2a1200' : '#ffffff', 'center');
  } else if (scene === S_TITLE) {
    ctx.fillStyle = 'rgba(15,8,30,0.35)'; ctx.fillRect(0, 0, W, 560);
    txt('GLASS BLOWER', CX, 120, F40B, '#ffffff', 'center');
    txt('RUSH', CX, 188, F64B, '#ffa933', 'center');
    txt('Hold to inflate. Hot glass swells faster', CX, 466, F17, '#e4dcf7', 'center');
    txt('Release on the line while heat says GO', CX, 490, F17, '#e4dcf7', 'center');
    txt('Fused perfect rows stack x2 x3 x5', CX, 514, F17, '#ffe066', 'center');
    drawButton(85, 540, 220, 64, 'TAP TO BLOW', true);
    drawShelf(712, 80, 'YOUR SHELF');
    if (best > 0) txt(bestLbl, CX, 636, F18B, '#ffd35a', 'center');
  } else {
    ctx.fillStyle = 'rgba(12,6,24,0.78)'; ctx.fillRect(0, 0, W, H);
    txt('SHATTERED!', CX, 110, F40B, '#ff7a5a', 'center');
    txt('SCORE', CX, 165, F15B, '#b9a8dc', 'center');
    txt(scoreStr, CX, 225, F54B, '#ffffff', 'center');
    if (newBest) txt('NEW BEST!', CX, 262, F20B, '#ffd35a', 'center');
    else txt(bestLbl, CX, 262, F18B, '#b9a8dc', 'center');
    if (vsKey !== vasesDone * 8 + runBestMultI) { vsKey = vasesDone * 8 + runBestMultI; vsStr = 'Vases finished: ' + vasesDone + '   Top multiplier: ' + MULT_STR[runBestMultI]; }
    txt(vsStr, CX, 296, F17, '#e4dcf7', 'center');
    drawShelf(470, 84, 'YOUR SHELF');
    drawButton(85, 660, 220, 70, 'BLOW AGAIN', overT > 0.5);
  }
}

/* ===== Audio per-frame (breath sound while holding) ===== */
function audioFrame() {
  if (!actx || !blowGain) return;
  try {
    if (scene === S_PLAY && pstate === P_HOLD) {
      blowGain.gain.value = 0.05;
      blowOsc.frequency.value = 150 + base * 2.2;
    } else {
      blowGain.gain.value = 0;
    }
  } catch (e) { /* ignore */ }
}

/* ===== Input ===== */
function toLogical(e) {
  var r = cv.getBoundingClientRect();
  lx = (e.clientX - r.left) * (W / r.width);
  ly = (e.clientY - r.top) * (H / r.height);
}
var lx = 0, ly = 0;
function handleDown() {
  if (scene === S_TITLE) { startRun(); return; }
  if (scene === S_OVER) {
    if (overT > 0.5 && lx > 65 && lx < 325 && ly > 645 && ly < 745) startRun();
    return;
  }
  if (pstate === P_READY) beginHold();
  else if (pstate !== P_HOLD) armed = true;
}
function onDown(e) {
  if (e.cancelable) e.preventDefault();
  initAudio();
  if (activeId !== -1) return;
  activeId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  toLogical(e);
  downFlag = true;
  handleDown();
}
function onUp(e) {
  if (e.pointerId !== activeId) return;
  activeId = -1; downFlag = false; armed = false;
}
cv.addEventListener('pointerdown', onDown);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('keydown', function (e) {
  if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
    e.preventDefault(); initAudio();
    if (activeId !== -1) return;
    activeId = -2; downFlag = true;
    lx = CX; ly = 700;
    if (scene === S_OVER) { if (overT > 0.5) startRun(); return; }
    handleDown();
  }
});
window.addEventListener('keyup', function (e) {
  if (e.code === 'Space' || e.code === 'Enter') { if (activeId === -2) { activeId = -1; downFlag = false; armed = false; } }
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { downFlag = false; activeId = -1; armed = false; }
});

/* ===== Main loop (fixed step accumulator) ===== */
var lastTs = 0, acc = 0;
function frame(ts) {
  window.requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  var dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  audioFrame();
}
bestStr = String(best); bestLbl = 'BEST ' + bestStr;
window.requestAnimationFrame(frame);

})();
</script>
</body>
</html>
